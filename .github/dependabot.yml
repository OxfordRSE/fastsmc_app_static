version: 2
# No Python entry: Dependabot cannot read the data script's inline dependencies (dependabot-core#11946).
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
