version: 2
# No Python entry: Dependabot cannot read the data script's inline dependencies (dependabot-core#11946).
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # typescript-eslint supports only TypeScript <6.1; lift once it supports 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Node type definitions track the Node major in .nvmrc; bump both together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
