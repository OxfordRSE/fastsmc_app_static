name: Audit workflows with zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
  schedule:
    - cron: '15 3 * * 1' # Every Monday at 03:15 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inputs are .github rather than .github/workflows so dependabot.yml is audited too.
      - name: Run zizmor (upload to code scanning)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github

      - name: Run zizmor (annotate and fail on findings)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github
          advanced-security: false
          annotations: true
